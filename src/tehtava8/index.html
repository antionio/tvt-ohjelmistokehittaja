<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Opiskelija</title>
        <style>
            table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
            }

            td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
            }

            tr:nth-child(even) {
            background-color: #dddddd;
            }
        </style>
    </head>
    <body>
        Nimi: <input type="text" id="name" />
        Ikä: <input type="number" id="age" />
        Kurssi: <input type="text" id="course" />
        Arvosana: <input type="number" id="grade" />
        <button onclick="addStudent()">Lisää</button>

        <h1>Opiskelijalista</h1>
        <table>
            <thead>
                <tr>
                    <th>Nimi</th>
                    <th>Ikä</th>
                    <th>Kurssi</th>
                    <th>Arvosana</th>
                </tr>
            </thead>
            <tbody id="studentList">
                <!-- Uusi rivi 1-->
                <!-- Uusi rivi 2-->
            </tbody>
        </table>
    </body>

    <script>
        class Student {

            constructor(name, age, course, grade) {
                this.name = name;
                this.age = age;
                this.course = course;
                this.grade = grade;
            }

            printDetails() {
                return `<tr><td>${this.name}</td><td>${this.age}</td><td>${this.course}</td><td>${this.printGrade()}</td>`;
                //return `Opiskelijan nimi: ${this.name}<br/>Ikä: ${this.age}<br/>Kurssi: ${this.course}<br/>Arvosana: ${this.printGrade()}<br/>`;
            }

            printGrade() {

                const grade = parseInt(this.grade);
                if (grade === 1) {
                    return "Hylätty";
                } else if (grade === 2) {
                    return "Hyväksytty";
                } else if (grade === 3) {
                    return "Hyvä";
                } else if (grade === 4) {
                    return "Erittäin Hyvä";
                } else if (grade === 5) {
                    return "Erinomainen";
                }
                return "Virhe!";
            }

        }

        const studentList = [];

        function addStudent() {
            const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;
            const course = document.getElementById("course").value;
            const grade = document.getElementById("grade").value;

            const student = new Student(name, age, course, grade);

            studentList.push(student);

            let students = "";
            for (let i = 0; i < studentList.length; i++) {
                students += studentList[i].printDetails();
            }

            document.getElementById("studentList").innerHTML = students;
        }
    </script>
</html>
