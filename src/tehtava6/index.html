<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Lamppu</title>
    </head>
    <body>
        <!-- 💡⚫ -->
        <h2>Lampun tila:</h2>
        <div id="lampuntila">&#128161;</div>
        <p><button onclick="kytkin()">Kytkin</button></p>
    </body>

    <script>
        class Lamppu {

            constructor() {
                this.tila = "sammunut";
            }

            sytyta() {
                this.tila = "päällä";
            }

            sammuta() {
                this.tila = "sammunut";
            }
        }

        const lamppu = new Lamppu();

        function kytkin() {
            if (lamppu.tila === "sammunut") {
                lamppu.sytyta();
            } else {
                lamppu.sammuta();
            }
            document.getElementById("lampuntila").innerHTML = lamppu.tila === "päällä" ? "&#128161;" : "&#128280;";
        }


    </script>
</html>
